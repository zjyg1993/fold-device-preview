<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>响应式预览示例</title><style>*{box-sizing:border-box}body{margin:0;padding:48px 32px;font-family:system-ui;background:#f8f9fc;color:#242c3e}small{color:#7290be;letter-spacing:3px}h1{font-size:clamp(28px,5vw,44px);font-weight:550;letter-spacing:-1.5px;margin:20px 0 12px}p{font-size:14px;color:#8490a4;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}.card{padding:24px;border-radius:18px;background:#fff;border:1px solid #e8ecf4;min-height:150px}.card b{font-size:26px;font-weight:500}.card p{font-size:12px}#size{display:inline-block;margin-top:24px;border:1px solid #dde5f2;border-radius:30px;padding:8px 16px;font:12px monospace;color:#55729e}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{min-height:100px}body{padding:44px 24px}}@media(prefers-color-scheme:dark){body{background:#1e222c;color:#e6eaf3}.card{background:#282d39;border-color:#353d4d}}</style></head><body><small>RESPONSIVE PREVIEW</small><h1>每一块屏幕，都恰到好处。</h1><p>这是本地响应式示例。切换设备姿态，观察视口与布局的实时变化。</p><span id="size"></span><div class="grid"><div class="card"><b>01</b><p>真实 CSS 视口</p></div><div class="card"><b>02</b><p>内屏与外屏切换</p></div><div class="card"><b>03</b><p>横向与纵向布局</p></div></div><script>function size(){document.getElementById('size').textContent=innerWidth+' × '+innerHeight+' CSS px'}addEventListener('resize',size);size()</script></body></html>
